<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Publicaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #D4AF37;
    --gold2: #f0c940;
    --bg: #0a0a0a;
    --card: #111111;
    --border: #222;
    --text: #e8e8e8;
    --muted: #666;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 30px 16px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800;
    color: var(--gold);
    letter-spacing: -1px;
    line-height: 1.1;
  }

  header p {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 8px;
    font-style: italic;
  }

  .controls {
    max-width: 680px;
    margin: 0 auto 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  label {
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    font-family: 'Syne', sans-serif;
    margin-bottom: 4px;
    display: block;
  }

  input, select, textarea {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
  }

  select option { background: #111; }

  .btn {
    width: 100%;
    background: var(--gold);
    color: #000;
    border: none;
    padding: 15px;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.2s, transform 0.1s;
  }

  .btn:hover { background: var(--gold2); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--gold);
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    display: none;
  }

  .loading span {
    display: inline-block;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .posts-grid {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .post-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    position: relative;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .post-num {
    font-family: 'Syne', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .post-text {
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
  }

  .post-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .btn-copy {
    flex: 1;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 9px 14px;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .btn-copy:hover {
    background: var(--gold);
    color: #000;
  }

  .btn-copy.copied {
    background: #1a3a1a;
    border-color: #4caf50;
    color: #4caf50;
  }

  .error {
    max-width: 680px;
    margin: 0 auto;
    background: #1a0a0a;
    border: 1px solid #5a1a1a;
    color: #ff6b6b;
    padding: 16px 20px;
    border-radius: 10px;
    font-size: 0.9rem;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>⚡ GENERADOR DE POSTS</h1>
  <p>10 publicaciones de valor listas para copiar y pegar</p>
</header>

<div class="controls">
  <div>
    <label>Tu servicio o nicho</label>
    <input type="text" id="servicio" placeholder="Ej: Canales de YouTube automatizados con IA" />
  </div>
  <div>
    <label>Tipo de grupos</label>
    <select id="tipo">
      <option value="emprendedores">Emprendedores</option>
      <option value="marketing digital">Marketing Digital</option>
      <option value="negocios online">Negocios Online</option>
      <option value="freelancers">Freelancers</option>
      <option value="inversiones">Inversiones y Dinero</option>
    </select>
  </div>
  <div>
    <label>Tu llamada a la acción</label>
    <input type="text" id="cta" placeholder="Ej: Escríbeme por WhatsApp al +34..." />
  </div>
  <button class="btn" id="generarBtn" onclick="generarPosts()">🔥 GENERAR 10 PUBLICACIONES</button>
</div>

<div class="loading" id="loading">
  <span>⚡ Generando tus publicaciones con IA...</span>
</div>

<div class="error" id="error"></div>

<div class="posts-grid" id="postsGrid"></div>

<script>
async function generarPosts() {
  const servicio = document.getElementById('servicio').value.trim();
  const tipo = document.getElementById('tipo').value;
  const cta = document.getElementById('cta').value.trim();

  if (!servicio) {
    alert('Por favor escribe tu servicio o nicho');
    return;
  }

  const btn = document.getElementById('generarBtn');
  const loading = document.getElementById('loading');
  const grid = document.getElementById('postsGrid');
  const errorDiv = document.getElementById('error');

  btn.disabled = true;
  loading.style.display = 'block';
  grid.innerHTML = '';
  errorDiv.style.display = 'none';

  const prompt = `Eres un experto en marketing de contenidos para redes sociales hispanohablantes.

Genera EXACTAMENTE 10 publicaciones de valor para grupos de Facebook de ${tipo}.
El servicio que se ofrece es: ${servicio}.
${cta ? `La llamada a la acción al final de cada post es: ${cta}` : ''}

REGLAS IMPORTANTES:
- Cada publicación debe aportar valor real (consejo, dato, tip, historia, pregunta provocadora)
- NO deben parecer anuncios directos, sino contenido útil
- Tono cercano, humano y natural en español
- Entre 3 y 6 párrafos cada una
- Usa emojis con moderación
- Varía los formatos: storytelling, lista de tips, pregunta, dato sorprendente, error común, etc.
- Al final de cada post incluye la CTA de forma natural

Responde ÚNICAMENTE con un JSON válido con este formato exacto, sin texto adicional ni markdown:
{"posts": ["post1 completo", "post2 completo", "post3 completo", "post4 completo", "post5 completo", "post6 completo", "post7 completo", "post8 completo", "post9 completo", "post10 completo"]}`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 4000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await response.json();
    const text = data.content.map(i => i.text || '').join('');
    
    let parsed;
    try {
      const clean = text.replace(/```json|```/g, '').trim();
      parsed = JSON.parse(clean);
    } catch(e) {
      throw new Error('Error al procesar la respuesta de IA');
    }

    const posts = parsed.posts;
    if (!posts || posts.length === 0) throw new Error('No se generaron publicaciones');

    posts.forEach((post, i) => {
      const card = document.createElement('div');
      card.className = 'post-card';
      card.style.animationDelay = `${i * 0.07}s`;
      card.innerHTML = `
        <div class="post-num">📌 Publicación ${i + 1} de 10</div>
        <div class="post-text">${escapeHtml(post)}</div>
        <div class="post-actions">
          <button class="btn-copy" onclick="copiar(this, ${i})">📋 Copiar</button>
        </div>
      `;
      grid.appendChild(card);
    });

    window._posts = posts;

  } catch(err) {
    errorDiv.textContent = '❌ Error: ' + err.message;
    errorDiv.style.display = 'block';
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
}

function copiar(btn, index) {
  const post = window._posts[index];
  navigator.clipboard.writeText(post).then(() => {
    btn.textContent = '✅ Copiado';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 Copiar';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
